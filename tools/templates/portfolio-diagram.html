<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720"><script src="vendor/gsap.min.js"></script><script src="scenes.js"></script><style>
{{FONTS}}
*{box-sizing:border-box;margin:0}html,body{width:1280px;height:720px;overflow:hidden;background:#f4f2ed}#root{--paper:#f4f2ed;--surface:#fffdf8;--ink:#202b35;--muted:#53606b;--line:#bbc0c3;--accent:#80542c;width:100%;height:100%;position:relative;color:var(--ink);font-family:"Noto Sans SC",sans-serif;background:var(--paper)}header{position:absolute;left:72px;right:72px;top:30px}#kind{font-size:21px;color:var(--muted)}h1{font-size:45px;line-height:1.5;margin-top:8px;font-weight:700}#purpose{font-size:24px;line-height:1.5;color:var(--muted);margin-top:8px}#stage{position:absolute;inset:0}svg{width:100%;height:100%;overflow:visible}svg text{fill:var(--ink);font-family:"Noto Sans SC",sans-serif}.small{font-size:21px}.large{font-size:39px;font-weight:700}.node-title{font-size:25px;font-weight:600}.node-caption{font-size:20px;fill:var(--muted)}.guide{fill:none;stroke:var(--line);stroke-width:2}.paper,.node-shape{fill:var(--surface);stroke:var(--line);stroke-width:2}.tint{fill:var(--accent);opacity:.12}.accent-line{stroke:var(--accent);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.accent-dot,.log-packet{fill:var(--accent)}.mapping-cursor{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:2}.phase.active .node-shape{stroke:var(--accent);stroke-width:3}.phase.active .node-title{fill:var(--ink)}.phase-note .node-shape{fill:#fcf0cc}.phase-seal .node-shape{stroke-dasharray:5 5}#state{position:absolute;left:72px;right:72px;top:625px;font-size:23px;line-height:1.6;color:var(--muted)}html[data-theme=dark] #root{--paper:#171c22;--surface:#242d35;--ink:#edf0f2;--muted:#b5bec6;--line:#66717c}html[data-theme=dark] .phase-note .node-shape{fill:#3a3428}html[data-theme=dark] body{background:#171c22}
</style><style>.topic-scene{position:absolute;inset:0;opacity:0;pointer-events:none}#flow-token{position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:var(--accent);pointer-events:none}</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="120" data-width="1280" data-height="720"><div id="flow-token" aria-hidden="true" data-layout-allow-overlap></div><div id="stage" data-layout-ignore></div><header><p id="kind"></p><h1 id="title"></h1><p id="purpose"></p></header><p id="state"></p></div>
<script>const TOPICS={{TOPICS}};window.__timelines=window.__timelines||{};
const stage=document.getElementById('stage'),token=document.getElementById('flow-token');
const scenes=TOPICS.map(topic=>{const element=document.createElement('div');element.className='topic-scene';element.innerHTML=PortfolioScenes.render(topic);stage.appendChild(element);const path=element.querySelector('[id$="-flow-path"]'),length=path.getTotalLength();path.style.strokeDasharray=String(length);const detail=element.querySelector('[id$="-scene-detail"]');if(detail?.getTotalLength)detail.dataset.pathLength=String(detail.getTotalLength());const points=Array.from({length:241},(_,i)=>{const p=path.getPointAtLength(length*i/240);return {x:p.x,y:p.y};});return {element,path,length,points,nodes:[...element.querySelectorAll('[data-phase]')]};});
const tl=gsap.timeline({paused:true}),driver={v:0};let chapter=-1,phase=-1,scene;
function paint(){const time=Math.min(119.999,tl.time()),index=Math.floor(time/12),progress=(time-index*12)/12,topic=TOPICS[index];if(chapter!==index){chapter=index;phase=-1;scenes.forEach((s,i)=>{s.element.style.opacity=i===index?'1':'0';s.element.setAttribute('aria-hidden',String(i!==index));});scene=scenes[index];document.getElementById('kind').textContent=topic.kind;document.getElementById('title').textContent=topic.title;document.getElementById('purpose').textContent=topic.purpose;document.getElementById('state').textContent=topic.state;document.getElementById('root').style.setProperty('--accent',topic.color);}const current=Math.min(3,Math.floor(progress*4));if(phase!==current){phase=current;scene.nodes.forEach((e,i)=>e.classList.toggle('active',i<=phase));}scene.path.style.strokeDashoffset=String(scene.length*(1-progress));const q=Math.min(239.999,progress*240),a=scene.points[Math.floor(q)],b=scene.points[Math.floor(q)+1],f=q%1;gsap.set(token,{x:a.x+(b.x-a.x)*f-8,y:a.y+(b.y-a.y)*f-8});PortfolioScenes.paint(topic.id,progress,scene.element);}
tl.to(driver,{v:120,duration:120,ease:'none',onUpdate:paint},0);window.__timelines.main=tl;window.__diagramProbe=()=>({id:TOPICS[chapter].id,phase,routeLength:scene.length,shape:scene.element.querySelector('svg').getAttribute('aria-label')});paint();
</script></body></html>
