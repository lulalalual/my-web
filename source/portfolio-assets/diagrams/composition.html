<script>const TOPICS=[{"id":"requirements","title":"通用面试需求","kind":"工作经历 · 方案交付","cover":"product-cover","color":"#80542c","purpose":"让尚未确定岗位的学生，也能开始有结构的面试训练。","state":"完成需求方案、交互规则与 176 条八维题库交付。","steps":[["学生任务","先明确练什么","方向未定时，不强制上传简历或选择岗位，降低训练入口的前置条件。"],["组织题目","8 维 · 176 条","题库记录按八维能力组织，定义抽题规则、来源标签和覆盖要求。"],["作答追问","规则与异常","说明作答、追问、超时、退出等状态，便于研发与评审理解需求边界。"],["报告复盘","八维能力反馈","设计八维能力反馈、分维度点评与逐题详情，让复盘对应具体改进方向。"]]},{"id":"knowledge","title":"知识库离线验收","kind":"工作经历 · 内容与测试交付","cover":"rag-cover","color":"#245a76","purpose":"让文档版本、检索结果与交接记录能够对应起来。","state":"完成 49 份知识正文整理与 8,054 条离线检索测试，交付数据卡、基线和版本记录。","steps":[["产品正文","结构与边界","整理产品说明、应用边界与来源，区分产品事实、待核实信息和使用限制。"],["版本绑定","正文 + SHA","正文、测试集、数据卡与基线通过文件哈希回链，避免验收了错误版本。"],["离线检索","命中与拒识","运行自建问法和拒识记录，比较切片、BM25 与命中位置，保留采样偏差。"],["人工复核","记录再交接","定位未判定、文档缺口与噪声；离线高分仍需真实问法和人工标签验证。"]]},{"id":"data","title":"数据接入与工具","kind":"工作经历 · 数据与接口交付","cover":"intern-cover","color":"#3d5a88","purpose":"把不同来源的数据，转成工具能够读取和交接的格式。","state":"完成 17 个业务 API 工具描述、3,045 条采集记录及 30 万级 CRM 接入材料。","steps":[["数据源","先核字段","核对来源、字段、分页与统计口径，避免把不同快照的数据量混为同一结果。"],["转换清洗","类型与分页","按中台契约转换字段，区分全量拉取、增量游标及失败重试的边界。"],["工具接入","API 描述","整理接口与 Coze 工具描述、测试材料和使用规则，便于应用调用和排查。"],["交接检查","异常与复跑","整理字段、分页、异常处理与复跑步骤，形成可交接的接口接入材料。"]]},{"id":"training","title":"AI 方法与实践培训","kind":"工作经历 · 亲自主讲","cover":"training-cover","color":"#7b463b","purpose":"让同事能把 AI 方法用于实际工作，并知道如何检查结果。","state":"亲自主讲 AI 方法与实践培训，完成讲义、操作案例与结果检查方法。","steps":[["具体任务","先讲工作","从资料、报告、知识库、网页、PPT 和图片任务出发，明确要交付什么。"],["组织上下文","材料与约束","解释模型原理、上下文、Agent、Skill、MCP，让工具调用服务于目标。"],["协作执行","分步骤完成","通过真实操作演示任务拆解、工具选择和分工，避免只展示一次生成效果。"],["检查沉淀","方法能复用","检查事实、格式和可用性，把可复用的步骤写成讲义与案例。"]]},{"id":"recruit","title":"RecruitAgent","kind":"个人阶段性工程 · 规则/模型适配","cover":"recruit-cover","color":"#316450","purpose":"把 JD 理解、简历对照与面试准备，组织在一个招聘任务流里。","state":"实现 JD 解析、简历对照、问题生成与规则回退，完成 8 项功能测试。","steps":[["JD 与简历","两份输入","从职位描述和候选人文本开始，明确岗位要求与个人经历的对照关系。"],["解析匹配","提取与对照","原模块提取职责、技能和要求，再按规则或模型路径给出匹配线索。"],["问题与风险","准备下一步","生成面试问题，并提示招聘文案可能需要人工复核的表述。初筛不是法律结论。"],["回退与验证","无密钥路径","模型不可用时回到原规则模式，便于本地复跑；没有真实招聘成功率数据。"]]},{"id":"pixel","title":"Pixel Motion Factory","kind":"个人工程 · 内容生产工作流","cover":"pixel-cover","color":"#704c88","purpose":"让内容、脚本、素材和渲染，成为可检查、可恢复的生产流程。","state":"实现任务 DAG、缓存恢复与质量门控制，保留真实渲染和技术检查记录。","steps":[["内容任务","先拆依赖","将输入内容和预期镜头拆为任务，明确每一步依赖什么文件。"],["工作流 DAG","缓存与恢复","任务 DAG 保存输入输出，使用哈希绑定三道人工门，变更后传播失效。"],["素材与渲染","真实候选","复用已登记素材，保留渲染文件和技术检查记录；不能用工程通过代替审美审片。"],["质量门","人工确认","以人工审阅控制内容、素材与成片的交付条件，保存检查记录。"]]},{"id":"evalops","title":"EvalOps RAG Flywheel","kind":"个人实验 · 离线检索评估","cover":"rag-cover","color":"#53652d","purpose":"先定义回答如何被检查，再比较检索配置。","state":"完成离线检索对照实验，输出配置、覆盖与引用检查的评估报告。","steps":[["测试问题","固定样例","为同一问题保留输入、预期线索与检索配置，明确实验比较的对象。"],["检索配置","切片与 Top K","切换切片、召回与重排配置，取回候选上下文；词频余弦不冒称真实 Faiss。"],["生成评估","抽取与规则","样例从上下文抽取答案，再按确定性规则记录覆盖与引用线索。"],["对照复盘","读报告","读取原实验报告比较配置。小样本差异不能推断线上总体效果。"]]},{"id":"agentic","title":"Agentic RL 工具优化","kind":"个人实验 · 工具轨迹与偏好数据","cover":"intern-cover","color":"#8b5031","purpose":"先找出工具调用轨迹中的策略问题，再整理偏好训练数据。","state":"完成工具轨迹检查、偏好对整理与 SFT / DPO 格式导出，7 项测试通过。","steps":[["调用轨迹","记录动作","保留 Agent 的步骤、工具使用与结果，作为后续规则检查的输入。"],["行为检查","识别投机","检查重复工具调用、无效澄清等模式；规则命中不等于完整智能评测。"],["偏好数据","形成样例","根据已有结果整理对照偏好样本，保留来源和生成口径。"],["格式导出","SFT / DPO","输出可检查的数据格式，供后续训练实验使用；当前不宣称训练收益。"]]},{"id":"raft","title":"Raft 与工程学习","kind":"学习图解 · 教程改写实践","cover":"product-cover","color":"#4e6680","purpose":"理解多个节点如何对同一批操作达成一致。","state":"完成 Raft 选举、日志复制与状态机应用的工程学习和复盘。","steps":[["选举","确定 Leader","节点通过任期与投票选出 Leader，用日志新旧约束投票。"],["复制日志","追加操作","Leader 将操作记录复制给其他节点，检查日志索引与任期是否衔接。"],["多数确认","推进提交","当前任期日志满足多数派条件后推进提交；网络分区不等于所有节点都能写。"],["状态机应用","可观察结果","按顺序应用已提交日志。它解释一致性流程，不展示伪造的集群运行面板。"]]},{"id":"employment","title":"就业核查流程","kind":"工作经历 · 需求方案","color":"#6b4b77","purpose":"把企业风险判断与就业真实性核实分开，让异常有复核与申诉路径。","state":"完成触发规则、双维判断、多路回访与人工复核的需求设计。","steps":[["触发核查","预计入职时间","按预计入职时间组织核查任务，分别记录材料与待核实信息。"],["双维判断","风险 / 真实性","企业经营风险与学生是否实际就业采用独立结论，OCR用于提取矛盾线索。"],["多路回访","学生与企业","规划电话、短信H5和独立企业回访，记录未接通、信息冲突和人工转接。"],["人工闭环","复核与申诉","将异常送入人工复核，保留解释、申诉和操作记录，避免单一信号自动定性。"]]}];window.__timelines=window.__timelines||{};
const stage=document.getElementById('stage'),token=document.getElementById('flow-token');
const scenes=TOPICS.map(topic=>{const element=document.createElement('div');element.className='topic-scene';element.innerHTML=PortfolioScenes.render(topic);stage.appendChild(element);const path=element.querySelector('[id$="-flow-path"]'),length=path.getTotalLength();path.style.strokeDasharray=String(length);const detail=element.querySelector('[id$="-scene-detail"]');if(detail?.getTotalLength)detail.dataset.pathLength=String(detail.getTotalLength());const points=Array.from({length:241},(_,i)=>{const p=path.getPointAtLength(length*i/240);return {x:p.x,y:p.y};});return {element,path,length,points,nodes:[...element.querySelectorAll('[data-phase]')]};});
const tl=gsap.timeline({paused:true}),driver={v:0};let chapter=-1,phase=-1,scene;

tl.to(driver,{v:120,duration:120,ease:'none',onUpdate:paint},0);window.__timelines.main=tl;window.__diagramProbe=()=>({id:TOPICS[chapter].id,phase,routeLength:scene.length,shape:scene.element.querySelector('svg').getAttribute('aria-label')});paint();
