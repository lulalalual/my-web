<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 766" role="img" aria-labelledby="title desc">
<title id="title">C++ 预处理、编译、汇编与链接原理示意</title><desc id="desc">四个阶段依次产生预处理源、汇编、目标文件和程序。其他目标文件与库参与链接，动态链接还有装载和运行时处理。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#245a76"/></marker></defs>
<rect width="1210" height="766" fill="#f2f4f7"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="62" font-size="36" font-weight="700" fill="#182638">C++ 从源码到可链接程序</text><text x="48" y="106" font-size="24" font-weight="400" fill="#46566b">原理示意 · 分阶段命令以 GCC 工具链为例</text><rect x="48" y="164" width="244" height="244" rx="14" fill="#fbfcfd" stroke="#a7b2c0" stroke-width="2"/><text x="70" y="202" font-size="23" font-weight="400" fill="#46566b">01</text><text x="70" y="252" font-size="34" font-weight="700" fill="#245a76">预处理</text><text x="70" y="299" font-size="22" font-weight="400" fill="#182638">展开 include 与宏</text><text x="70" y="333" font-size="22" font-weight="400" fill="#182638">保留条件编译结果</text><text x="70" y="380" font-size="19" font-weight="400" fill="#46566b">main.cpp → main.ii</text><path d="M298 278 H329" fill="none" stroke="#245a76" stroke-width="3" marker-end="url(#arrow)"/><rect x="338" y="164" width="244" height="244" rx="14" fill="#fbfcfd" stroke="#a7b2c0" stroke-width="2"/><text x="360" y="202" font-size="23" font-weight="400" fill="#46566b">02</text><text x="360" y="252" font-size="34" font-weight="700" fill="#245a76">编译</text><text x="360" y="299" font-size="22" font-weight="400" fill="#182638">检查语法与类型</text><text x="360" y="333" font-size="22" font-weight="400" fill="#182638">生成并优化汇编</text><text x="360" y="380" font-size="19" font-weight="400" fill="#46566b">main.ii → main.s</text><path d="M588 278 H619" fill="none" stroke="#245a76" stroke-width="3" marker-end="url(#arrow)"/><rect x="628" y="164" width="244" height="244" rx="14" fill="#fbfcfd" stroke="#a7b2c0" stroke-width="2"/><text x="650" y="202" font-size="23" font-weight="400" fill="#46566b">03</text><text x="650" y="252" font-size="34" font-weight="700" fill="#245a76">汇编</text><text x="650" y="299" font-size="22" font-weight="400" fill="#182638">编码机器指令</text><text x="650" y="333" font-size="22" font-weight="400" fill="#182638">记录符号与重定位</text><text x="650" y="380" font-size="19" font-weight="400" fill="#46566b">main.s → main.o</text><path d="M878 278 H909" fill="none" stroke="#245a76" stroke-width="3" marker-end="url(#arrow)"/><rect x="918" y="164" width="244" height="244" rx="14" fill="#fbfcfd" stroke="#a7b2c0" stroke-width="2"/><text x="940" y="202" font-size="23" font-weight="400" fill="#46566b">04</text><text x="940" y="252" font-size="34" font-weight="700" fill="#245a76">链接</text><text x="940" y="299" font-size="22" font-weight="400" fill="#182638">解析跨文件符号</text><text x="940" y="333" font-size="22" font-weight="400" fill="#182638">按规则布局与重定位</text><text x="940" y="380" font-size="19" font-weight="400" fill="#46566b">main.o + 库 → app</text><rect x="48" y="452" width="824" height="184" rx="14" fill="#fbfcfd" stroke="#a7b2c0" stroke-width="2"/><text x="70" y="492" font-size="24" font-weight="700" fill="#182638">示例命令：四步分别观察输出</text><text x="70" y="535" font-size="20" font-weight="400" fill="#46566b">g++ -E main.cpp -o main.ii</text><text x="470" y="535" font-size="20" font-weight="400" fill="#46566b">g++ -S main.ii -o main.s</text><text x="70" y="583" font-size="20" font-weight="400" fill="#46566b">g++ -c main.s -o main.o</text><text x="470" y="583" font-size="20" font-weight="400" fill="#46566b">g++ main.o -o app</text><rect x="918" y="452" width="244" height="184" rx="14" fill="#e2eaf0" stroke="#a7b2c0" stroke-width="2"/><text x="940" y="492" font-size="23" font-weight="700" fill="#182638">其他目标文件 / 库</text><text x="940" y="532" font-size="21" font-weight="400" fill="#46566b">按需要参与链接</text><text x="940" y="572" font-size="21" font-weight="400" fill="#46566b">静态与动态链接</text><text x="940" y="604" font-size="21" font-weight="400" fill="#46566b">处理方式不同</text><path d="M1040 444 V420" fill="none" stroke="#245a76" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="687" font-size="22" font-weight="400" fill="#46566b">main.o 是可重定位目标文件；app 的格式和装载过程取决于平台。</text><text x="48" y="726" font-size="22" font-weight="400" fill="#46566b">编译器可合并阶段；动态链接也可能在装载或运行时继续解析。</text></g></svg>