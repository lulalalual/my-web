<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 790" role="img" aria-labelledby="title desc">
<title id="title">Linux 进程虚拟地址空间原理示意</title><desc id="desc">高低地址、内核与用户态权限、栈、映射、动态分配、静态数据和代码的常见关系。具体地址和大小受平台、链接器与ASLR影响，不按比例。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#245a76"/></marker></defs>
<rect width="1080" height="790" fill="#f2f4f7"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="60" font-size="36" font-weight="700" fill="#182638">进程虚拟地址空间</text><text x="48" y="102" font-size="24" font-weight="400" fill="#46566b">Linux 常见原理示意 · 以常见 x86 布局为例</text><text x="46" y="159" font-size="20" font-weight="400" fill="#46566b">高地址</text><text x="46" y="701" font-size="20" font-weight="400" fill="#46566b">低地址</text><rect x="150" y="132" width="526" height="64" rx="14" fill="#e2eaf0" stroke="#a7b2c0" stroke-width="2"/><text x="174" y="159" font-size="25" font-weight="700" fill="#182638">内核相关地址区域</text><text x="174" y="183" font-size="18" font-weight="400" fill="#46566b">用户态不能直接访问</text><rect x="150" y="204" width="526" height="64" rx="14" fill="#fbfcfd" stroke="#a7b2c0" stroke-width="2"/><text x="174" y="231" font-size="25" font-weight="700" fill="#182638">栈</text><text x="174" y="255" font-size="18" font-weight="400" fill="#46566b">调用帧、局部对象；常见向下增长</text><rect x="150" y="276" width="526" height="64" rx="14" fill="#e9eff5" stroke="#a7b2c0" stroke-width="2"/><text x="174" y="303" font-size="25" font-weight="700" fill="#182638">映射区域</text><text x="174" y="327" font-size="18" font-weight="400" fill="#46566b">共享库、文件映射、匿名映射</text><rect x="150" y="348" width="526" height="64" rx="14" fill="#f2f4f7" stroke="#a7b2c0" stroke-width="2"/><text x="174" y="375" font-size="25" font-weight="700" fill="#182638">未映射空间</text><text x="174" y="399" font-size="18" font-weight="400" fill="#46566b">图中间隔与比例不代表实际大小</text><rect x="150" y="420" width="526" height="64" rx="14" fill="#e7f0ec" stroke="#a7b2c0" stroke-width="2"/><text x="174" y="447" font-size="25" font-weight="700" fill="#182638">堆等动态分配区域</text><text x="174" y="471" font-size="18" font-weight="400" fill="#46566b">分配器也可能使用 mmap 区域</text><rect x="150" y="492" width="526" height="64" rx="14" fill="#fbfcfd" stroke="#a7b2c0" stroke-width="2"/><text x="174" y="519" font-size="25" font-weight="700" fill="#182638">.data / .bss</text><text x="174" y="543" font-size="18" font-weight="400" fill="#46566b">静态存储期的可写数据</text><rect x="150" y="564" width="526" height="64" rx="14" fill="#e9eff5" stroke="#a7b2c0" stroke-width="2"/><text x="174" y="591" font-size="25" font-weight="700" fill="#182638">.rodata / .text</text><text x="174" y="615" font-size="18" font-weight="400" fill="#46566b">只读数据与可执行指令</text><rect x="150" y="636" width="526" height="64" rx="14" fill="#e2eaf0" stroke="#a7b2c0" stroke-width="2"/><text x="174" y="663" font-size="25" font-weight="700" fill="#182638">低地址保护区域</text><text x="174" y="687" font-size="18" font-weight="400" fill="#46566b">具体范围由映射与系统配置决定</text><rect x="706" y="132" width="326" height="576" rx="14" fill="#fbfcfd" stroke="#a7b2c0" stroke-width="2"/><text x="728" y="172" font-size="27" font-weight="700" fill="#182638">读图时记住</text><text x="728" y="222" font-size="23" font-weight="700" fill="#245a76">虚拟地址 ≠ 物理位置</text><text x="728" y="254" font-size="19" font-weight="400" fill="#46566b">由页表等机制建立映射</text><text x="728" y="318" font-size="23" font-weight="700" fill="#245a76">地址与权限由实现决定</text><text x="728" y="350" font-size="19" font-weight="400" fill="#46566b">不能仅按 C++ 类型猜位置</text><text x="728" y="414" font-size="23" font-weight="700" fill="#245a76">布局与地址可变化</text><text x="728" y="446" font-size="19" font-weight="400" fill="#46566b">平台、链接器、PIE、ASLR</text><text x="728" y="510" font-size="23" font-weight="700" fill="#245a76">增长方向只是常见示意</text><text x="728" y="542" font-size="19" font-weight="400" fill="#46566b">不是所有动态分配都来自 brk</text><text x="728" y="606" font-size="23" font-weight="700" fill="#245a76">不按比例绘制</text><text x="728" y="638" font-size="19" font-weight="400" fill="#46566b">不是物理内存的分区图</text><text x="48" y="757" font-size="21" font-weight="400" fill="#46566b">根据正文重绘的原理示意；传统 32 位 3G/1G 划分只是特定内核配置。</text></g></svg>