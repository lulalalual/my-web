<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#faf9f6"/>
  <text x="56" y="64" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#2f2c24">Agentic RL Tool Optimizer Architecture</text>
  <text x="56" y="96" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#665f50">Trajectory Evaluation + Preference Data + GRPO-style Optimization</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7a5c1c"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #c6a76b; stroke-width: 2; rx: 8; }
      .gate { fill: #f4efe4; stroke: #9a741f; stroke-width: 2; rx: 8; }
      .label { font-family: Arial, Microsoft YaHei, sans-serif; font-size: 17px; font-weight: 700; fill: #302a1c; }
      .small { font-family: Arial, Microsoft YaHei, sans-serif; font-size: 13px; fill: #665f50; }
      .arrow { stroke: #7a5c1c; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="box" x="64" y="150" width="170" height="82"/>
  <text class="label" x="110" y="184">TaskSpec</text>
  <text class="small" x="90" y="208">instruction + tools</text>
  <path class="arrow" d="M234 191 L302 191"/>
  <rect class="box" x="306" y="150" width="190" height="82"/>
  <text class="label" x="358" y="184">Trajectory</text>
  <text class="small" x="331" y="208">plan / calls / answer</text>
  <path class="arrow" d="M496 191 L564 191"/>
  <rect class="box" x="568" y="150" width="210" height="82"/>
  <text class="label" x="617" y="184">Evaluator</text>
  <text class="small" x="592" y="208">reward + metrics</text>
  <path class="arrow" d="M778 191 L846 191"/>
  <rect class="box" x="850" y="150" width="185" height="82"/>
  <text class="label" x="890" y="184">Preferences</text>
  <text class="small" x="880" y="208">chosen / rejected</text>
  <path class="arrow" d="M1035 191 L1100 191"/>
  <rect class="box" x="1104" y="150" width="130" height="82"/>
  <text class="label" x="1136" y="184">DPO</text>
  <text class="small" x="1128" y="208">pairwise</text>
  <rect class="gate" x="155" y="330" width="210" height="90"/>
  <text class="label" x="205" y="365">SFT Export</text>
  <text class="small" x="183" y="391">high reward trajectories</text>
  <rect class="gate" x="535" y="330" width="210" height="90"/>
  <text class="label" x="575" y="365">GRPO Export</text>
  <text class="small" x="560" y="391">grouped candidates</text>
  <rect class="gate" x="915" y="330" width="210" height="90"/>
  <text class="label" x="950" y="365">Light Trainer</text>
  <text class="small" x="945" y="391">torch / python fallback</text>
  <path class="arrow" d="M400 232 C400 285 260 285 260 330"/>
  <path class="arrow" d="M673 232 L640 330"/>
  <path class="arrow" d="M673 232 C840 270 995 276 1020 330"/>
  <rect class="box" x="210" y="535" width="230" height="86"/>
  <text class="label" x="256" y="569">Failure Modes</text>
  <text class="small" x="238" y="594">tool / argument / plan</text>
  <rect class="box" x="525" y="535" width="230" height="86"/>
  <text class="label" x="565" y="569">Gaming Check</text>
  <text class="small" x="552" y="594">repetition / clarify abuse</text>
  <rect class="box" x="840" y="535" width="230" height="86"/>
  <text class="label" x="886" y="569">Report</text>
  <text class="small" x="866" y="594">DPO vs GRPO + gates</text>
  <path class="arrow" d="M568 232 C500 355 365 425 325 535"/>
  <path class="arrow" d="M640 420 L640 535"/>
  <path class="arrow" d="M1020 420 C1020 480 955 490 955 535"/>
  <path class="arrow" d="M755 578 L840 578"/>
</svg>
